<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NookCine</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/sidebar.css">
</head>
<body>
    <div class="sidebar">
        <h1 class="logo">Nook<span>Cine</span></h1>
        <nav>
            <ul>   
                <li class="menu-item">
                    <img src="assets/icons/home.png" alt="Home Icon">
                    <a href="#">Home</a>
                </li>

                <li class="menu-item">
                    <img src="assets/icons/movie.png" alt="Movie Icon">
                    <a href="#">Filmes</a>
                </li>    

                <li class="menu-item">
                    <img src="assets/icons/series.png" alt="Series Icon">
                    <a href="#">Séries</a>
                </li>

                <li class="menu-item">
                    <img src="assets/icons/trending.png" alt="Trending Icon">
                    <a href="#">Em alta</a>
                </li>

                <li class="menu-item">
                    <img src="assets/icons/favorite.png" alt="List Icon">
                    <a href="#">Favoritos</a>
                </li>
            </ul>
        </nav>
        <div class="user-info">
            <img src="assets/icons/user.png" alt="User Avatar">
            <span>Olá, Usuário!</span>
        </div>
    </div>
    <div class="main-content"></div>
</body>
</html>
