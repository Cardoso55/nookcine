<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NookCine | Detalhes</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/details.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <main class="media-details">
        <!-- Botão de Voltar -->
         
        <a href="index.html" class="back-btn">
            <i data-lucide="arrow-left"></i> Voltar
        </a>

        <!-- Banner -->
    
        <section class="media-banner">
            <div class="banner-overlay"></div>
        </section>

        <!-- Conteúdo Principal -->

        <section class="media-content">

            <img
                src=""
                alt=""
                class="media-poster"
            >

            <div class="media-data">

                <h2 class="media-title"></h2>

                <div class="media-meta">
                    <span class="media-rating"><i data-lucide="star"></i></span>
                    <span class="media-date"><i data-lucide="calendar"></i></span>
                    <span class="media-runtime"><i data-lucide="clock"></i></span>
                </div>

                <div class="genres">
                </div>

                <div class="media-actions">
                    <button class="btn-primary">
                        <i data-lucide="play"></i> Assistir Trailer
                    </button>
                    <button class="btn-secondary">
                        <i data-lucide="heart"></i> Favoritar
                    </button>
                </div>

            </div>

        </section>

        <!-- Sinopse -->

        <section class="media-description">
            <h2>Sinopse</h2>
            <p class="media-overview">
            </p>
        </section>

        <!-- Informações Extras -->

        <section class="media-extra">
        
            <div class="info-card">
                <h3 class="info-title">Elenco</h3>
                <ul class="info-cast"></ul>
            </div>

            <div class="info-card">
                <h3 class="info-title">Produtoras</h3>
                <ul class="info-production-companies"></ul>
            </div>

            

        </section>

        <!-- Filmes Relacionados -->

        <section class="related-media">

            <h2>Relacionados</h2>

            <div class="related-grid"></div>
            
        </section>
    </main>

<script src="js/api/config.js"></script>
<script src="js/api/endpoints.js"></script>
<script src="js/api/tmdb.js"></script>
<script src="components/section.js"></script>
<script src="components/card.js"></script>

<script src="js/details.js"></script>

</body>
</html>
