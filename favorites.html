<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NookCine</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/favorites.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <section class="top-menu">
            <button class="menu-toggle">
                <i data-lucide="menu"></i>
            </button>

            <div class="search-bar">
                <img src="assets/icons/search.png" alt="Search Icon">
                <input type="text" placeholder="Pesquisar filmes e séries...">
            </div>
            <div>
                <button class="user-info"><i data-lucide="circle-user-round"></i></button>
            </div>
        </section>

        <div id="favorites-container"></div>

        <div id="search-container" class="hidden"></div>

    </div>

    <script src="js/api/config.js"></script>
    <script src="js/api/tmdb.js"></script>
    <script src="js/components/section.js"></script>
    <script src="js/components/card.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/app.js"></script>
    <script src="js/api/media.js"></script>
    <script src="js/services/favorites.js"></script>
    <script src="js/services/search.js"></script>

</body>

</html>
