<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NookCine | Filmes</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/movie.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div id="sidebar-container"></div>
    <div class="main-content">
        <section class="top-menu">
            <button class="menu-toggle">
                <i data-lucide="menu"></i>
            </button>

            <div class="search-bar">
                <img src="assets/icons/search.png" alt="Search Icon">
                <input type="text" placeholder="Pesquisar filmes e séries...">
            </div>
            <div>
                <button class="user-info"><i data-lucide="circle-user-round"></i></button>
            </div>
        </section>

        <section class="hero-banner">
            <div class="hero-overlay">
                <div class="hero-content">
                    <span class="hero-category"></span>
                    <h1 class="hero-title"></h1>
                    <p class="hero-info"></p>
                    <p class="hero-description"></p>
                    <div class="hero-buttons">
                        <button class="btn-watch">Assitir agora</button>
                        <button id="btn-details" class="btn-details">Mais informações</button>
                    </div>
                    <div class="hero-indicators"></div>
                </div>
            </div>
        </section>

        <div id="movies-container"></div>

    </div>

    <script src="js/api/config.js"></script>
    <script src="js/api/endpoints.js"></script>
    <script src="js/api/tmdb.js"></script>
    <script src="components/section.js"></script>
    <script src="components/card.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/app.js"></script>
    <script src="js/api/hero.js"></script>
</body>

</html>
